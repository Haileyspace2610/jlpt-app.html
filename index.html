<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8fafc" id="themeColorMeta">
<title>JLPT N1–N5 學習辭典</title>
<style>
:root{
  --bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;--input:#f8fafc;
  --sakura50:#fff5f7;--sakura100:#ffe3ec;--sakura400:#f687b3;--sakura500:#ed64a6;--sakura600:#d53f8c;
  --matcha50:#f0fdf4;--matcha100:#dcfce7;--matcha500:#22c55e;--matcha600:#16a34a;
  --amber50:#fffbeb;--amber100:#fef3c7;--amber500:#f59e0b;--amber600:#d97706;
  --radius:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html.dark{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text2:#cbd5e1;--muted:#64748b;
  --border:#334155;--border2:#475569;--input:#0f172a;
  --sakura50:#4a1d2e;--sakura100:#5c2438;--matcha50:#0f2d1a;--matcha100:#123d24;
  --amber50:#3b2a0a;--amber100:#4a350d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;
  padding-bottom:calc(var(--sab) + 24px);transition:background .3s,color .3s;font-size:15px}
@media(min-width:900px){body{font-size:16px}}
#errorBanner{display:none;background:#fde0e0;color:#b71c1c;border-bottom:1px solid #e53935;
  padding:10px 14px;font-size:.8rem;white-space:pre-wrap;word-break:break-all;
  position:sticky;top:0;z-index:100}
#errorBanner button{float:right;background:#e53935;color:#fff;border:none;border-radius:6px;
  padding:2px 8px;font-size:.75rem;cursor:pointer;margin-left:8px}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--border);backdrop-filter:blur(10px);padding-top:var(--sat)}
html.dark header{background:rgba(15,23,42,.92)}
.header-inner{max-width:1180px;margin:0 auto;padding:10px 14px;display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-icon{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--sakura500),var(--matcha500));
  color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0}
.logo-text h1{margin:0;font-size:15px;font-weight:700;
  background:linear-gradient(90deg,var(--sakura600),var(--matcha600));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text p{margin:0;font-size:11px;color:var(--muted);display:none}
@media(min-width:640px){.logo-text h1{font-size:17px}.logo-text p{display:block}}
.header-actions{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);
  padding:8px 11px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;
  transition:.2s;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.btn:hover{border-color:var(--sakura400)}
.btn-primary{background:var(--sakura500);color:#fff;border-color:var(--sakura500)}
.btn-primary:hover{background:var(--sakura600);border-color:var(--sakura600)}
.btn-icon{padding:8px;font-size:15px;line-height:1}
main{max-width:1180px;margin:0 auto;padding:14px}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--card);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;
  transition:.2s;white-space:nowrap}
.cat-tab.active{background:var(--sakura500);color:#fff;border-color:var(--sakura500);
  box-shadow:0 2px 6px rgba(237,100,166,.3)}
.controls{background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:14px}
.filters-row{display:flex;gap:8px;align-items:center;justify-content:space-between;
  margin-bottom:10px;flex-wrap:wrap}
.level-filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.level-filters::-webkit-scrollbar{display:none}
.level-btn{flex:0 0 auto;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;
  border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;transition:.2s}
.level-btn.active{background:var(--sakura500);color:#fff;border-color:var(--sakura500)}
.bookmark-btn{flex:0 0 auto;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;
  border:1px solid var(--amber500);background:var(--amber50);color:var(--amber600);
  cursor:pointer;display:inline-flex;align-items:center;gap:4px}
html.dark .bookmark-btn{color:var(--amber100)}
.bookmark-btn.active{background:var(--amber500);color:#fff}
.search-row{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:768px){.search-row{grid-template-columns:2fr 1fr}}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;border-radius:12px;
  border:1px solid var(--border);background:var(--input);color:var(--text);
  font-size:14px;outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--sakura400);box-shadow:0 0 0 3px var(--sakura100)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px}
.quiz-actions{display:flex;gap:8px}
.quiz-actions .btn{flex:1;justify-content:center;padding:10px 12px}
.stats{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;
  font-size:13px;color:var(--muted);flex-wrap:wrap;gap:6px}
.stats .count{color:var(--sakura600);font-weight:700}
html.dark .stats .count{color:var(--sakura400)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;
  border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.06);
  transition:.2s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;
  gap:6px;margin-bottom:8px;flex-wrap:wrap}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;
  display:inline-block;white-space:nowrap}
.badge-N1{background:#fee2e2;color:#b91c1c}.badge-N2{background:#ffedd5;color:#c2410c}
.badge-N3{background:#fef3c7;color:#a16207}.badge-N4{background:#d1fae5;color:#047857}
.badge-N5{background:#dbeafe;color:#1d4ed8}
html.dark .badge-N1{background:#4c1414;color:#fca5a5}
html.dark .badge-N2{background:#4a1e08;color:#fdba74}
html.dark .badge-N3{background:#3b2a0a;color:#fcd34d}
html.dark .badge-N4{background:#0f2d1a;color:#6ee7b7}
html.dark .badge-N5{background:#0c1f3d;color:#93c5fd}
.badge-cat{background:#ede9fe;color:#6d28d9}
html.dark .badge-cat{background:#2d1b4e;color:#c4b5fd}
.badge-year{background:var(--input);color:var(--text2)}
.card-actions{display:flex;gap:6px}
.card-actions button{background:none;border:none;color:var(--muted);cursor:pointer;
  padding:4px;font-size:14px;line-height:1;transition:.2s}
.card-actions button:hover{color:var(--sakura500)}
.card-actions button.bookmarked{color:var(--amber500)}
.card-word{font-size:22px;font-weight:700;letter-spacing:.02em;color:var(--text);margin:0 0 2px}
.card-reading{font-size:13px;color:var(--sakura600);font-weight:500;margin:0 0 8px}
html.dark .card-reading{color:var(--sakura400)}
.card-meaning{font-size:14px;font-weight:600;color:var(--text);margin:0 0 10px}
.card-explain{font-size:13px;color:var(--text2);margin:0 0 10px;line-height:1.5}
.card-example{background:var(--input);border-radius:10px;padding:10px;
  border:1px solid var(--border);font-size:12px;color:var(--text2);
  margin-bottom:10px;line-height:1.55}
.card-example .quote{display:block;font-size:10px;font-weight:700;
  color:var(--sakura500);margin-bottom:4px}
html.dark .card-example .quote{color:var(--sakura400)}
.card-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;
  padding-top:10px;border-top:1px solid var(--border)}
.card-links a{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--input);
  color:var(--text2);text-decoration:none;border:1px solid var(--border);transition:.2s}
.card-links a:hover{border-color:var(--sakura400);color:var(--sakura500)}
.empty{text-align:center;padding:60px 20px;background:var(--card);
  border-radius:var(--radius);border:1px dashed var(--border2);color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;font-size:13px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;
  justify-content:center;padding:12px;background:rgba(15,23,42,.6);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.modal-panel{background:var(--card);border-radius:20px;width:100%;max-width:520px;
  max-height:90vh;overflow-y:auto;padding:20px;position:relative;
  border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-panel.wide{max-width:640px}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;
  color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
.modal h2{margin:0 0 16px;font-size:17px;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;
  color:var(--text2);margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;
  border-radius:10px;border:1px solid var(--border);background:var(--input);
  color:var(--text);font-size:14px;font-family:inherit;outline:none}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  border-color:var(--sakura400);box-shadow:0 0 0 3px var(--sakura100)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--border)}
.drawer-panel{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:440px;
  background:var(--card);z-index:60;
  padding:20px calc(20px + env(safe-area-inset-right,0)) calc(20px + var(--sab)) 20px;
  overflow-y:auto;transform:translateX(100%);transition:transform .3s;
  border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer-panel.show{transform:translateX(0)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55;
  display:none;backdrop-filter:blur(2px)}
.drawer-backdrop.show{display:block}
.section-label{font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.section-label:first-child{margin-top:0}
.flashcard{perspective:1000px;width:100%;height:280px;margin-bottom:20px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;
  transition:transform .6s cubic-bezier(.4,0,.2,1);
  transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flashcard-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:16px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;border:1px solid var(--border)}
.fc-front{background:linear-gradient(135deg,var(--sakura50),var(--card))}
.fc-back{background:#1e293b;color:#f1f5f9;transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.fc-back .fc-example{background:rgba(255,255,255,.08);padding:8px 10px;
  border-radius:8px;font-size:12px;color:#cbd5e1;margin-top:8px;
  text-align:left;width:100%;font-style:italic}
.quiz-option{width:100%;padding:12px 14px;margin-bottom:8px;border-radius:12px;
  border:1px solid var(--border);background:var(--input);color:var(--text);
  font-size:14px;text-align:left;cursor:pointer;transition:.2s;font-family:inherit}
.quiz-option:hover:not(:disabled){border-color:var(--matcha500)}
.quiz-option:disabled{cursor:default}
.quiz-option.correct{background:#d1fae5;border-color:#10b981;color:#065f46;font-weight:600}
.quiz-option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b;font-weight:600}
html.dark .quiz-option.correct{background:#064e3b;color:#6ee7b7}
html.dark .quiz-option.wrong{background:#7f1d1d;color:#fca5a5}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:200;
  max-width:90vw;text-align:center}
#toast.show{opacity:1}
.footer-hint{text-align:center;font-size:11px;color:var(--muted);
  margin-top:24px;padding:0 12px}
</style>
</head>
<body>

<div id="errorBanner">
  <button onclick="this.parentElement.style.display='none'">關閉</button>
  <strong>⚠️ 程式錯誤</strong>
  <span id="errorMsg"></span>
</div>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">日</div>
      <div class="logo-text">
        <h1>JLPT N1–N5 學習辭典</h1>
        <p>單字 · 文法 · 考試重點 · 模擬試題</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openAddModal()">➕</button>
      <button class="btn" onclick="openDrawer()">🗄️</button>
      <button class="btn btn-icon" onclick="toggleDarkMode()" id="darkBtn">🌙</button>
    </div>
  </div>
</header>

<main>
  <div class="cat-tabs" id="catTabs"></div>
  <section class="controls">
    <div class="filters-row">
      <div class="level-filters" id="levelFilters"></div>
      <button class="bookmark-btn" id="bookmarkBtn" onclick="toggleBookmarkFilter()">
        ⭐ 收藏 <span id="bookmarkCount">0</span>
      </button>
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋單字、假名、釋義、例句..." oninput="onSearch()">
      </div>
      <div class="quiz-actions">
        <button class="btn btn-primary" onclick="startFlashcardQuiz()">🎴 翻牌測驗</button>
        <button class="btn btn-primary" onclick="startChoiceQuiz()" style="background:var(--matcha500);border-color:var(--matcha500)">📝 四選一</button>
      </div>
    </div>
  </section>
  <div class="stats">
    <span>共 <span class="count" id="countDisplay">0</span> 筆資料</span>
    <span id="statsHint" style="font-size:11px">支援 OJAD 音調 / Takoboto / Mazii</span>
  </div>
  <section class="grid" id="contentGrid"></section>
  <div class="empty" id="emptyState" style="display:none">
    <h3>查無相關資料</h3>
    <p>試試調整搜尋條件</p>
    <button class="btn btn-primary" onclick="loadDefaultData()">📥 載入預設資料庫</button>
  </div>
  <p class="footer-hint">資料內嵌於此檔 · 離線可用</p>
</main>

<!-- 新增/編輯模態 -->
<div class="modal" id="addModal">
  <div class="modal-panel">
    <button class="modal-close" onclick="closeAddModal()">✕</button>
    <h2 id="modalTitle">➕ 新增資料</h2>
    <form id="wordForm" onsubmit="saveWord(event)">
      <input type="hidden" id="editId">
      <input type="hidden" id="editCat">
      <div class="form-group">
        <label>分類 *</label>
        <select id="inputCat" onchange="onCatChange()">
          <option value="vocabulary">單字</option>
          <option value="grammar">文法</option>
          <option value="examPoints">考試重點</option>
          <option value="quiz">模擬試題</option>
        </select>
      </div>
      <div class="form-group">
        <label>JLPT 級別 *</label>
        <select id="inputLevel">
          <option value="N1">N1</option><option value="N2">N2</option>
          <option value="N3">N3</option><option value="N4">N4</option>
          <option value="N5">N5</option>
        </select>
      </div>
      <div id="fields-vocabulary">
        <div class="form-row">
          <div class="form-group"><label>日文單字 *</label><input type="text" id="v_word"></div>
          <div class="form-group"><label>讀音</label><input type="text" id="v_reading"></div>
        </div>
        <div class="form-group"><label>詞類</label><input type="text" id="v_category"></div>
        <div class="form-group"><label>中文釋義 *</label><input type="text" id="v_meaning"></div>
        <div class="form-group"><label>例句</label><textarea id="v_example" rows="2"></textarea></div>
      </div>
      <div id="fields-grammar" style="display:none">
        <div class="form-group"><label>文法句型 *</label><input type="text" id="g_pattern"></div>
        <div class="form-group"><label>中文意思 *</label><input type="text" id="g_meaning"></div>
        <div class="form-group"><label>解說</label><textarea id="g_explanation" rows="2"></textarea></div>
        <div class="form-group"><label>例句</label><textarea id="g_example" rows="2"></textarea></div>
      </div>
      <div id="fields-examPoints" style="display:none">
        <div class="form-group"><label>標題 *</label><input type="text" id="e_title"></div>
        <div class="form-group"><label>內容 *</label><textarea id="e_content" rows="3"></textarea></div>
        <div class="form-group"><label>提示</label><input type="text" id="e_tips"></div>
      </div>
      <div id="fields-quiz" style="display:none">
        <div class="form-group"><label>題目 *</label><textarea id="q_question" rows="2"></textarea></div>
        <div class="form-group"><label>選項（每行一個）*</label><textarea id="q_options" rows="4"></textarea></div>
        <div class="form-group"><label>正確答案（1-4）*</label><input type="number" id="q_answer" min="1" max="4" value="1"></div>
        <div class="form-group"><label>解釋</label><input type="text" id="q_explanation"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeAddModal()">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- 測驗模態 -->
<div class="modal" id="quizModal">
  <div class="modal-panel wide">
    <button class="modal-close" onclick="closeQuizModal()">✕</button>
    <h2><span id="quizTitle"></span><span style="margin-left:auto;font-size:12px;color:var(--muted)" id="quizProgress"></span></h2>
    <div id="flashcardMode" style="display:none">
      <div class="flashcard" onclick="flipCard()">
        <div class="flashcard-inner" id="fcInner">
          <div class="fc-face fc-front">
            <div class="badges" style="margin-bottom:10px">
              <span class="badge badge-N1" id="fcLevel"></span>
              <span class="badge badge-cat" id="fcCategory"></span>
            </div>
            <h3 id="fcWord" style="margin:0 0 6px;font-size:32px;font-weight:800"></h3>
            <p id="fcReading" style="margin:0;color:var(--sakura600);font-size:14px"></p>
            <p style="margin-top:16px;font-size:11px;color:var(--muted)">👆 點擊卡片翻面</p>
          </div>
          <div class="fc-face fc-back">
            <p style="margin:0;font-size:11px;color:#94a3b8">中文釋義</p>
            <h4 id="fcMeaning" style="margin:4px 0 12px;font-size:22px;color:#f687b3"></h4>
            <div class="fc-example" id="fcExample"></div>
            <p id="fcYear" style="margin:8px 0 0;font-size:11px;color:#94a3b8"></p>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" style="flex:1;justify-content:center" onclick="prevCard()">← 上一張</button>

/* ===== 讀取嵌入的兩個 JSON ===== */
function readEmbeddedJSON(id){
  const el = document.getElementById(id);
  if(!el) return null;
  const raw = el.textContent.trim();
  if(!raw) return null;
  try{ return JSON.parse(raw); }
  catch(e){ console.warn('JSON ' + id + ' 解析失敗', e); return null; }
}

/* ===== 合併函式：把三份資料合併成一份 ===== */
function buildMergedData(){
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));

  // 合併語法 JSON（deepseek_json_All.json）
  const grammarJson = readEmbeddedJSON('json-grammar');
  if(grammarJson && typeof grammarJson === 'object'){
    ['vocabulary','grammar','examPoints','quiz'].forEach(cat=>{
      if(Array.isArray(grammarJson[cat])){
        grammarJson[cat].forEach((item,i)=>{
          if(item && typeof item === 'object'){
            item.id = item.id || (cat[0] + '_ext_' + i + '_' + Math.floor(Math.random()*10000));
            base[cat].push(item);
          }
        });
      }
    });
  }

  // 合併單字 JSON（jlpt_words_backup_2026-10-09.json）
  const wordsJson = readEmbeddedJSON('json-words');
  if(Array.isArray(wordsJson)){
    const seen = new Set();
    // 先把內建單字寫入 set 避免重複
    base.vocabulary.forEach(w=>{ if(w.word) seen.add(w.word); });

    wordsJson.forEach((w, i)=>{
      if(!w || !w.word) return;
      // 跳過重複（同一個 word 只保留一次）
      if(seen.has(w.word)) return;
      seen.add(w.word);
      base.vocabulary.push({
        id: w.id || ('wv_' + i),
        level: w.level || 'N1',
        word: w.word,
        reading: w.reading || '',
        meaning: w.meaning || '',
        category: w.category || '',
        example: w.example || '',
        year: w.year || ''
      });
    });
  }

  return base;
}

/* ===== 儲存安全版 ===== */
const STORAGE_KEY = "jlpt_study_v4";
const BOOKMARK_KEY = "jlpt_bookmarks_v4";

function cloneDefault(){
  try{ return buildMergedData(); }
  catch(e){ console.error('buildMergedData 失敗', e); return {vocabulary:[],grammar:[],examPoints:[],quiz:[]}; }
}
function isValidData(d){
  return d && typeof d === "object"
    && Array.isArray(d.vocabulary) && Array.isArray(d.grammar)
    && Array.isArray(d.examPoints) && Array.isArray(d.quiz);
}
function safeGet(key){
  try{ if(typeof localStorage !== "undefined" && localStorage) return localStorage.getItem(key); }
  catch(e){ console.warn("localStorage 讀取失敗", e); }
  return null;
}
function safeSet(key, val){
  try{ if(typeof localStorage !== "undefined" && localStorage){ localStorage.setItem(key, val); return true; } }
  catch(e){ console.warn("localStorage 寫入失敗", e); }
  return false;
}
function safeRemove(key){
  try{ if(typeof localStorage !== "undefined" && localStorage) localStorage.removeItem(key); }
  catch(e){}
}

function loadAll(){
  const raw = safeGet(STORAGE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(isValidData(parsed)) DATA = parsed;
      else DATA = cloneDefault();
    }catch(e){ DATA = cloneDefault(); }
  }else{
    DATA = cloneDefault();
  }
  const rawB = safeGet(BOOKMARK_KEY);
  if(rawB){
    try{ BOOKMARKS = new Set(JSON.parse(rawB)); }catch(e){ BOOKMARKS = new Set(); }
  }
}

function getFiltered(){
  const list = DATA[STATE.cat] || [];
  return list.filter(item=>{
    if(STATE.level !== "ALL" && item.level !== STATE.level) return false;
    if(STATE.bookmarkOnly && !BOOKMARKS.has(item.id)) return false;
    if(STATE.keyword){
      const kw = STATE.keyword.toLowerCase();
      try{ if(!JSON.stringify(item).toLowerCase().includes(kw)) return false; }
      catch(e){ return false; }
    }
    return true;
  });
}

function generateExternalLinks(word){
  const e = encodeURIComponent(word || "");
  return {
    ojad: `https://www.gavo.t.u-tokyo.ac.jp/ojad/search/index/word:${e}`,
    takoboto: `https://takoboto.jp/?q=${e}`,
    mazii: `https://mazii.net/zh-TW/search/word/jatw/${e}`
  };
}

function renderContent(){
  const grid = document.getElementById("contentGrid");
  const empty = document.getElementById("emptyState");
  const countEl = document.getElementById("countDisplay");
  if(!grid) return;
  const list = getFiltered();
  if(countEl) countEl.textContent = list.length;
  if(list.length === 0){
    grid.innerHTML = "";
    if(empty) empty.style.display = "block";
    return;
  }
  if(empty) empty.style.display = "none";
  try{
    if(STATE.cat === "vocabulary") grid.innerHTML = list.map(renderVocabCard).join("");
    else if(STATE.cat === "grammar") grid.innerHTML = list.map(renderGrammarCard).join("");
    else if(STATE.cat === "examPoints") grid.innerHTML = list.map(renderExamCard).join("");
    else if(STATE.cat === "quiz") grid.innerHTML = list.map(renderQuizCard).join("");
    bindQuizCards();
  }catch(e){
    console.error(e);
    grid.innerHTML = `<div style="grid-column:1/-1;padding:20px;color:#c00">渲染錯誤：${e.message}</div>`;
  }
}

function bindQuizCards(){
  document.querySelectorAll("[data-quizcard]").forEach(card=>{
    const qid = card.getAttribute("data-quizcard");
    const item = DATA.quiz.find(x=>x.id===qid);
    if(!item) return;
    const btns = card.querySelectorAll(".quiz-option");
    btns.forEach(btn=>{
      btn.onclick = ()=>{
        const idx = parseInt(btn.getAttribute("data-idx"));
        btns.forEach(b=>b.disabled=true);
        if(idx === item.answer) btn.classList.add("correct");
        else{ btn.classList.add("wrong"); if(btns[item.answer]) btns[item.answer].classList.add("correct"); }
        const exp = card.querySelector(".quiz-expl");
        if(exp){ exp.style.display = "block"; exp.textContent = "解釋：" + (item.explanation || ""); }
      };
    });
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

    const m = document.getElementById("v_meaning").value.trim();
    if(!w || !m){ toast("請填寫單字與釋義"); return; }

      category:document.getElementById("v_category").value.trim(),
      meaning:m, example:document.getElementById("v_example").value.trim() };
  }else if(cat === "grammar"){
    const p = document.getElementById("g_pattern").value.trim();
    const m = document.getElementById("g_meaning").value.trim();
    if(!p || !m){ toast("請填寫句型與意思"); return; }
    obj = {...obj, pattern:p, meaning:m,
      explanation:document.getElementById("g_explanation").value.trim(),
      example:document.getElementById("g_example").value.trim() };
  }else if(cat === "examPoints"){
    const t = document.getElementById("e_title").value.trim();
    const c = document.getElementById("e_content").value.trim();
    if(!t || !c){ toast("請填寫標題與內容"); return; }
    obj = {...obj, title:t, content:c, tips:document.getElementById("e_tips").value.trim() };
  }else if(cat === "quiz"){
    const q = document.getElementById("q_question").value.trim();
    const optsRaw = document.getElementById("q_options").value.trim().split("\n").map(s=>s.trim()).filter(Boolean);
    const ans = parseInt(document.getElementById("q_answer").value)-1;
    if(!q || optsRaw.length < 2){ toast("請填寫題目與至少 2 個選項"); return; }
    obj = {...obj, question:q, options:optsRaw, answer:isNaN(ans)?0:ans,
      explanation:document.getElementById("q_explanation").value.trim() };
  }
  if(editId && editCat){
    const list = DATA[editCat]||[];
    const idx = list.findIndex(x=>String(x.id)===String(editId));
    if(idx > -1){
      if(editCat !== cat){ list.splice(idx,1); DATA[cat].push({...obj, id:editId}); }
      else list[idx] = {...list[idx], ...obj};
    }
  }else{
    DATA[cat].push({...obj, id: cat[0] + Date.now() + Math.floor(Math.random()*1000)});
  }
  saveData(); renderAll(); closeAddModal(); toast("✅ 已儲存");
}

/* ===== 完全重複判斷：把 item 轉成可比較的字串（去掉 id）===== */
function normalizeItem(item){
  if(!item || typeof item !== "object") return "";
  const keys = Object.keys(item).filter(k => k !== "id").sort();
  const normalized = {};
  keys.forEach(k => { normalized[k] = item[k]; });
  try{ return JSON.stringify(normalized); }
  catch(e){ return ""; }
}

/* ===== 建立某分類現有的 normalized Set（加速比對）===== */
function buildNormalizedSet(cat){
  const list = DATA[cat] || [];
  const set = new Set();
  list.forEach(item => {
    const n = normalizeItem(item);
    if(n) set.add(n);
  });
  return set;
}

/* ===== upsert：完全重複就跳過，否則追加 ===== */
function upsertItems(cat, items, idPrefix){
  const existingSet = buildNormalizedSet(cat);
  let added = 0, skipped = 0;
  (items || []).forEach(item => {
    if(!item || typeof item !== "object"){ skipped++; return; }
    const n = normalizeItem(item);
    if(!n){ skipped++; return; }
    if(existingSet.has(n)){ skipped++; return; }
    existingSet.add(n);
    DATA[cat].push({
      ...item,
      id: item.id || (idPrefix + Date.now() + Math.floor(Math.random()*10000))
    });
    added++;
  });
  return { added, skipped };
}

function mergeImport(p){
  const counts = { vocabulary:0, grammar:0, examPoints:0, quiz:0, skipped:0 };

  // 情況 1：純陣列 → 當作單字匯入
  if(Array.isArray(p)){
    const items = [];
    p.forEach(item => {
      if(item && item.word && (item.meaning || item.definition)){
        items.push({
          level: item.level || "N1",
          word: item.word,
          reading: item.reading || item.kana || "",
          meaning: item.meaning || item.definition || "",
          category: item.category || item.type || item.pos || item.partOfSpeech || "",
          example: item.example || item.sentence || "",
          year: item.year || ""
        });
      }
    });
    const r = upsertItems("vocabulary", items, "v_");
    counts.vocabulary = r.added;
    counts.skipped = r.skipped;
    return counts;
  }
  if(p && typeof p === "object"){
  // 情況 2：物件 → 逐類 upsert
  if(p && typeof p === "object"){
    ["vocabulary","grammar","examPoints","quiz"].forEach(cat=>{
      if(Array.isArray(p[cat])){
        const r = upsertItems(cat, p[cat], cat[0] + "_");
        counts[cat] = r.added;
        counts.skipped += r.skipped;
      }
    });
  }
  return counts;
}

function importCSVFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const text = ev.target.result.replace(/^\uFEFF/, "");
      const rows = parseCSV(text);
      const buckets = { vocabulary:[], grammar:[], examPoints:[], quiz:[] };

      rows.slice(1).forEach(r=>{
        const cat = (r[0]||"").trim();
        if(!buckets[cat]) return;
        const level = (r[1]||"").trim() || "N1";
        const main = (r[2]||"").trim();
        if(!main) return;

        if(cat === "vocabulary"){
          buckets.vocabulary.push({
            level, word:main,
            reading:(r[3]||"").trim(),
            meaning:(r[4]||"").trim(),
            category:(r[5]||"").trim(),
            example:(r[6]||"").trim(),
            year:""
          });
        }else if(cat === "grammar"){
          buckets.grammar.push({
            level, pattern:main,
            meaning:(r[4]||"").trim(),
            explanation:(r[5]||"").trim(),
            example:(r[6]||"").trim()
          });
        }else if(cat === "examPoints"){
          buckets.examPoints.push({
            level, title:main,
            content:(r[4]||"").trim(),
            tips:(r[5]||"").trim()
          });
        }else if(cat === "quiz"){
          const opts = (r[7]||"").split("|").map(s=>s.trim()).filter(Boolean);
          if(opts.length >= 2){
            buckets.quiz.push({
              level, question:main, options:opts,
              answer: parseInt(r[8]||"0")||0,
              explanation:(r[5]||"").trim()
            });
          }
        }
      });

      const counts = { vocabulary:0, grammar:0, examPoints:0, quiz:0, skipped:0 };
      Object.keys(buckets).forEach(cat=>{
        const r = upsertItems(cat, buckets[cat], cat[0] + "_");
        counts[cat] = r.added;
        counts.skipped += r.skipped;
      });

      saveData(); renderAll();
      toast(`✅ 新增：單字+${counts.vocabulary}、文法+${counts.grammar}、重點+${counts.examPoints}、試題+${counts.quiz}｜跳過重複 ${counts.skipped} 筆`);
      closeDrawer();
    }catch(err){ toast("CSV 解析失敗：" + err.message); }
    e.target.value = "";
  };
  reader.readAsText(file, "UTF-8");
}
function parseCSV(text){
  const rows = []; let cur = [], field = "", inQ = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    }else{
      if(c === '"') inQ = true;
      else if(c === ","){ cur.push(field); field = ""; }
      else if(c === "\n"){ cur.push(field); rows.push(cur); cur=[]; field=""; }
      else if(c === "\r"){}
      else field += c;
    }
  }
  if(field || cur.length){ cur.push(field); rows.push(cur); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

function startFlashcardQuiz(){
  const list = getFiltered();
  if(list.length === 0){ toast("目前沒有可測驗的資料"); return; }
  quizState = { mode:"flash", list, index:0, flipped:false };
  document.getElementById("quizTitle").textContent = "🎴 翻牌測驗";
  document.getElementById("flashcardMode").style.display = "block";
  document.getElementById("choiceMode").style.display = "none";
  document.getElementById("quizModal").classList.add("show");
  renderFlashcard();
}
function renderFlashcard(){
  const c = quizState.list[quizState.index]; if(!c) return;
  document.getElementById("quizProgress").textContent = `${quizState.index+1} / ${quizState.list.length}`;
  const lvEl = document.getElementById("fcLevel");
  lvEl.className = "badge badge-" + (c.level||"N5");
  lvEl.textContent = c.level || "";
  document.getElementById("fcCategory").textContent = c.category || c.pattern || "單字";
  document.getElementById("fcWord").textContent = c.word || c.pattern || c.title || c.question || "";
  document.getElementById("fcReading").textContent = c.reading ? `[ ${c.reading} ]` : "";
  document.getElementById("fcMeaning").textContent = c.meaning || c.content || c.explanation || (c.options ? c.options[c.answer] : "");
  const ex = document.getElementById("fcExample");
  ex.textContent = c.example || c.explanation || "";
  ex.style.display = (c.example || c.explanation) ? "block" : "none";
  document.getElementById("fcYear").textContent = c.year || "";
  document.getElementById("fcInner").classList.remove("flipped");
  quizState.flipped = false;
}
function flipCard(){
  quizState.flipped = !quizState.flipped;
  document.getElementById("fcInner").classList.toggle("flipped", quizState.flipped);
}
function nextCard(){
  if(quizState.index < quizState.list.length - 1){ quizState.index++; renderFlashcard(); }
  else toast("🎉 已完成所有卡片");
}
function prevCard(){
  if(quizState.index > 0){ quizState.index--; renderFlashcard(); }
}
function startChoiceQuiz(){
  const vocab = (DATA.vocabulary||[]).filter(item=>{
    if(STATE.level !== "ALL" && item.level !== STATE.level) return false;
    return item.meaning && item.word;
  });
  if(vocab.length < 4){ toast("至少需要 4 個單字才能測驗"); return; }
  const shuffled = [...vocab].sort(()=>Math.random()-0.5).slice(0, Math.min(10, vocab.length));
  quizState = { mode:"choice", list:shuffled, index:0, pool:vocab };
  document.getElementById("quizTitle").textContent = "📝 四選一測驗";
  document.getElementById("flashcardMode").style.display = "none";
  document.getElementById("choiceMode").style.display = "block";
  document.getElementById("quizModal").classList.add("show");
  renderChoiceQuestion();
}
function renderChoiceQuestion(){
  const c = quizState.list[quizState.index]; if(!c) return;
  document.getElementById("quizProgress").textContent = `${quizState.index+1} / ${quizState.list.length}`;
  const lvEl = document.getElementById("mcLevel");
  lvEl.className = "badge badge-" + (c.level||"N5");
  lvEl.textContent = c.level || "";
  document.getElementById("mcCategory").textContent = c.category || "單字";
  document.getElementById("mcWord").textContent = c.word || "";
  document.getElementById("mcReading").textContent = c.reading ? `[ ${c.reading} ]` : "";
  document.getElementById("mcFeedback").textContent = "";
  const others = quizState.pool.filter(x=>x.id !== c.id).sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [...others, c].sort(()=>Math.random()-0.5);
  const box = document.getElementById("mcOptions");
  box.innerHTML = opts.map(o=>`<button class="quiz-option" data-correct="${o.id === c.id}">${escapeHtml(o.meaning)}</button>`).join("");
  box.querySelectorAll(".quiz-option").forEach(btn=>{
    btn.onclick = ()=>{
      const correct = btn.getAttribute("data-correct") === "true";
      box.querySelectorAll(".quiz-option").forEach(b=>{
        b.disabled = true;
        if(b.getAttribute("data-correct") === "true") b.classList.add("correct");
      });
      if(!correct) btn.classList.add("wrong");
      const fb = document.getElementById("mcFeedback");
      fb.textContent = correct ? "✅ 正確！" : "❌ 答錯了";
      fb.style.color = correct ? "var(--matcha500)" : "#dc2626";
      setTimeout(()=>{
        if(quizState.index < quizState.list.length - 1){ quizState.index++; renderChoiceQuestion(); }
        else{ toast("🎉 測驗完成！"); closeQuizModal(); }
      }, 1000);
    };
  });
}
