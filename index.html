<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f8fafc" id="themeColorMeta">
  <title>JLPT N1–N5 學習辭典</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #fff;
      --text: #1e293b;
      --text2: #475569;
      --muted: #94a3b8;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --input: #f8fafc;
      --sakura50: #fff5f7;
      --sakura100: #ffe3ec;
      --sakura400: #f687b3;
      --sakura500: #ed64a6;
      --sakura600: #d53f8c;
      --matcha50: #f0fdf4;
      --matcha100: #dcfce7;
      --matcha500: #22c55e;
      --matcha600: #16a34a;
      --amber50: #fffbeb;
      --amber100: #fef3c7;
      --amber500: #f59e0b;
      --amber600: #d97706;
      --radius: 16px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    html.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text2: #cbd5e1;
      --muted: #64748b;
      --border: #334155;
      --border2: #475569;
      --input: #0f172a;
      --sakura50: #4a1d2e;
      --sakura100: #5c2438;
      --matcha50: #0f2d1a;
      --matcha100: #123d24;
      --amber50: #3b2a0a;
      --amber100: #4a350d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: calc(var(--sab) + 24px);
      transition: background .3s, color .3s;
      font-size: 15px
    }

    @media(min-width:900px) {
      body {
        font-size: 16px
      }
    }

    #errorBanner {
      display: none;
      background: #fde0e0;
      color: #b71c1c;
      border-bottom: 1px solid #e53935;
      padding: 10px 14px;
      font-size: .8rem;
      white-space: pre-wrap;
      word-break: break-all;
      position: sticky;
      top: 0;
      z-index: 100
    }

    #errorBanner button {
      float: right;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: .75rem;
      cursor: pointer;
      margin-left: 8px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      padding-top: var(--sat)
    }

    html.dark header {
      background: rgba(15, 23, 42, .92)
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--sakura500), var(--matcha500));
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0
    }

    .logo-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--sakura600), var(--matcha600));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .logo-text p {
      margin: 0;
      font-size: 11px;
      color: var(--muted);
      display: none
    }

    @media(min-width:640px) {
      .logo-text h1 {
        font-size: 17px
      }

      .logo-text p {
        display: block
      }
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: .2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit
    }

    .btn:hover {
      border-color: var(--sakura400)
    }

    .btn-primary {
      background: var(--sakura500);
      color: #fff;
      border-color: var(--sakura500)
    }

    .btn-primary:hover {
      background: var(--sakura600);
      border-color: var(--sakura600)
    }

    .btn-icon {
      padding: 8px;
      font-size: 15px;
      line-height: 1
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px
    }

    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: none
    }

    .cat-tabs::-webkit-scrollbar {
      display: none
    }

    .cat-tab {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
      white-space: nowrap
    }

    .cat-tab.active {
      background: var(--sakura500);
      color: #fff;
      border-color: var(--sakura500);
      box-shadow: 0 2px 6px rgba(237, 100, 166, .3)
    }

    .controls {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      border: 1px solid var(--border);
      margin-bottom: 14px
    }

    .filters-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .level-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      min-width: 0
    }

    .level-filters::-webkit-scrollbar {
      display: none
    }

    /* 五十音篩選列 */
    .kana-filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0;
      margin-bottom: 10px;
      scrollbar-width: none;
    }

    .kana-filter-row::-webkit-scrollbar {
      display: none;
    }

    .kana-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text2);
      cursor: pointer;
      transition: .2s;
    }

    .kana-btn.active {
      background: var(--matcha500);
      color: #fff;
      border-color: var(--matcha500);
    }

    .level-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text2);
      cursor: pointer;
      transition: .2s
    }

    .level-btn.active {
      background: var(--sakura500);
      color: #fff;
      border-color: var(--sakura500)
    }

    .bookmark-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--amber500);
      background: var(--amber50);
      color: var(--amber600);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    html.dark .bookmark-btn {
      color: var(--amber100)
    }

    .bookmark-btn.active {
      background: var(--amber500);
      color: #fff
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px
    }

    @media(min-width:768px) {
      .search-row {
        grid-template-columns: 2fr 1fr
      }
    }

    .search-wrap {
      position: relative
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: inherit
    }

    .search-wrap input:focus {
      border-color: var(--sakura400);
      box-shadow: 0 0 0 3px var(--sakura100)
    }

    .search-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px
    }

    .quiz-actions {
      display: flex;
      gap: 8px
    }

    .quiz-actions .btn {
      flex: 1;
      justify-content: center;
      padding: 10px 12px
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 4px 10px;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px
    }

    .stats .count {
      color: var(--sakura600);
      font-weight: 700
    }

    html.dark .stats .count {
      color: var(--sakura400)
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px
    }

    @media(min-width:640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(min-width:1024px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px
      }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      transition: .2s;
      display: flex;
      flex-direction: column
    }

    .card:hover {
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08)
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }

    .badge {
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      display: inline-block;
      white-space: nowrap
    }

    .badge-N1 {
      background: #fee2e2;
      color: #b91c1c
    }

    .badge-N2 {
      background: #ffedd5;
      color: #c2410c
    }

    .badge-N3 {
      background: #fef3c7;
      color: #a16207
    }

    .badge-N4 {
      background: #d1fae5;
      color: #047857
    }

    .badge-N5 {
      background: #dbeafe;
      color: #1d4ed8
    }

    html.dark .badge-N1 {
      background: #4c1414;
      color: #fca5a5
    }

    html.dark .badge-N2 {
      background: #4a1e08;
      color: #fdba74
    }

    html.dark .badge-N3 {
      background: #3b2a0a;
      color: #fcd34d
    }

    html.dark .badge-N4 {
      background: #0f2d1a;
      color: #6ee7b7
    }

    html.dark .badge-N5 {
      background: #0c1f3d;
      color: #93c5fd
    }

    .badge-cat {
      background: #ede9fe;
      color: #6d28d9
    }

    html.dark .badge-cat {
      background: #2d1b4e;
      color: #c4b5fd
    }

    .badge-year {
      background: var(--input);
      color: var(--text2)
    }

    .card-actions {
      display: flex;
      gap: 6px
    }

    .card-actions button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
      line-height: 1;
      transition: .2s
    }

    .card-actions button:hover {
      color: var(--sakura500)
    }

    .card-actions button.bookmarked {
      color: var(--amber500)
    }

    .card-word {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--text);
      margin: 0 0 2px
    }

    .card-reading {
      font-size: 13px;
      color: var(--sakura600);
      font-weight: 500;
      margin: 0 0 8px
    }

    html.dark .card-reading {
      color: var(--sakura400)
    }

    .card-meaning {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 10px
    }

    .card-explain {
      font-size: 13px;
      color: var(--text2);
      margin: 0 0 10px;
      line-height: 1.5
    }

    .card-example {
      background: var(--input);
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 10px;
      line-height: 1.55
    }

    .card-example .quote {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--sakura500);
      margin-bottom: 4px
    }

    html.dark .card-example .quote {
      color: var(--sakura400)
    }

    .card-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border)
    }

    .card-links a {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--input);
      color: var(--text2);
      text-decoration: none;
      border: 1px solid var(--border);
      transition: .2s
    }

    .card-links a:hover {
      border-color: var(--sakura400);
      color: var(--sakura500)
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px dashed var(--border2);
      color: var(--muted)
    }

    .empty h3 {
      color: var(--text);
      margin: 0 0 6px;
      font-size: 16px
    }

    .empty p {
      margin: 0 0 16px;
      font-size: 13px
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(15, 23, 42, .6);
      backdrop-filter: blur(4px)
    }

    .modal.show {
      display: flex
    }

    .modal-panel {
      background: var(--card);
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25)
    }

    .modal-panel.wide {
      max-width: 640px
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px
    }

    .modal h2 {
      margin: 0 0 16px;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .form-group {
      margin-bottom: 12px
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 5px
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--sakura400);
      box-shadow: 0 0 0 3px var(--sakura100)
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    @media(max-width:500px) {
      .form-row {
        grid-template-columns: 1fr
      }
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border)
    }

    .drawer-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      background: var(--card);
      z-index: 60;
      padding: 20px calc(20px + env(safe-area-inset-right, 0)) calc(20px + var(--sab)) 20px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .3s;
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 30px rgba(0, 0, 0, .15)
    }

    .drawer-panel.show {
      transform: translateX(0)
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .5);
      z-index: 55;
      display: none;
      backdrop-filter: blur(2px)
    }

    .drawer-backdrop.show {
      display: block
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 16px 0 8px
    }

    .section-label:first-child {
      margin-top: 0
    }

    .flashcard {
      perspective: 1000px;
      width: 100%;
      height: 280px;
      margin-bottom: 20px;
      cursor: pointer
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .6s cubic-bezier(.4, 0, .2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg)
    }

    .fc-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border)
    }

    .fc-front {
      background: linear-gradient(135deg, var(--sakura50), var(--card))
    }

    .fc-back {
      background: #1e293b;
      color: #f1f5f9;
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg)
    }

    .fc-back .fc-example {
      background: rgba(255, 255, 255, .08);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 8px;
      text-align: left;
      width: 100%;
      font-style: italic
    }

    .quiz-option {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: .2s;
      font-family: inherit
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--matcha500)
    }

    .quiz-option:disabled {
      cursor: default
    }

    .quiz-option.correct {
      background: #d1fae5;
      border-color: #10b981;
      color: #065f46;
      font-weight: 600
    }

    .quiz-option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
      font-weight: 600
    }

    html.dark .quiz-option.correct {
      background: #064e3b;
      color: #6ee7b7
    }

    html.dark .quiz-option.wrong {
      background: #7f1d1d;
      color: #fca5a5
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + var(--sab));
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .85);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: .3s;
      pointer-events: none;
      z-index: 200;
      max-width: 90vw;
      text-align: center
    }

    #toast.show {
      opacity: 1
    }

    .footer-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 24px;
      padding: 0 12px
    }
  </style>
</head>

<body>

  <div id="errorBanner">
    <button onclick="this.parentElement.style.display='none'">關閉</button>
    <strong>⚠️ 程式錯誤</strong>
    <span id="errorMsg"></span>
  </div>

  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">日</div>
        <div class="logo-text">
          <h1>JLPT N1–N5 學習辭典</h1>
          <p>單字 · 文法 · 考試重點 · 模擬試題</p>
        </div>
      </div>
      <div class="header-actions">

  "grammar": [
   {
      "id":"g_pdf_01",
      "level":"N5",
      "pattern":"助詞「は」",
      "meaning":"提示主題、對比、強調",
      "explanation":"1.提示主題：將名詞拉出來作為討論對象。2.對比：Aは...、Bは...。3.強調：將受詞提前至句首。4.否定句：經常用「は」取代「が」或「を」來表示排他性否定。接續：名詞 + は。",
      "example":"私は学生です。（關於我，我是學生。）"
    },
    {
      "id":"g_pdf_02",
      "level":"N5",
      "pattern":"助詞「が」",
      "meaning":"主詞標記、對象標記、焦點排他、出現存在、轉折",
      "explanation":"1.主詞標記：描述客觀事實。2.對象標記：搭配好、嫌い、上手、下手、わかる等。3.焦點排他：強調「正是這個」。4.出現存在：提到全新資訊或發現。5.轉折：連接兩個對立句子，相當於「但是」。接續：名詞 + が。",
      "example":"雨が降っています。（下雨了。）"
    },
    {
      "id":"g_pdf_03",
      "level":"N5",
      "pattern":"助詞「に」",
      "meaning":"時間點、移動目的地、動作對象、存在場所、狀態轉變",
      "explanation":"1.時間點：具體數字、星期、年月。2.目的地：行く、来る、帰る。3.動作對象：給予、教學、發送。4.存在場所：ある、いる。5.狀態轉變：なる。注意：昨日、明日、毎日後面不加「に」。",
      "example":"7時に起きます。（7點起床。）"
    },
    {
      "id":"g_pdf_04",
      "level":"N5",
      "pattern":"助詞「で」",
      "meaning":"動作場所、手段工具、範圍限定、原因理由、狀態描述",
      "explanation":"1.動作場所：在某地進行某動作。2.手段/工具/材料：用筷子吃、用木頭做。3.範圍/限定：在1小時內、在班上。4.原因/理由：接名詞，表示因為某具體事物（如生病、事故）。5.狀態描述：全家人一起。",
      "example":"図書館で本を読みます。（在圖書館看書。）"
    },
    {
      "id":"g_pdf_05",
      "level":"N5",
      "pattern":"助詞「も」",
      "meaning":"類同並列、強調否定、強調數量之多、條件的延伸",
      "explanation":"1.類同：我也是學生。2.強調否定：連一個都沒有。3.強調數量多：竟然有100本書那麼多。4.條件延伸：即使下雨也要出門。注意：遇到「は」「が」「を」時會強制刪除這些助詞。",
      "example":"私も学生です。（我也是學生。）"
    },
    {
      "id":"g_pdf_06",
      "level":"N5",
      "pattern":"助詞「か」",
      "meaning":"疑問標記、選擇、不確定性、反問",
      "explanation":"1.疑問：標記句子疑問語氣。2.選擇：AかBか。3.不確定性：疑問詞 + か，表示某人、某物、某處。4.反問：自問自答或語氣較強的懷疑。5.進階：～かどうか（是否）。",
      "example":"田中先生は学生ですか。（田中先生是學生嗎？）"
    },
    {
      "id":"g_pdf_07",
      "level":"N5",
      "pattern":"助詞「から」",
      "meaning":"時間空間起點、原因理由、構成材料、順序起始",
      "explanation":"1.起點：9時から授業が始まる。2.原因：雨が降るから。3.材料：古い木から作る。4.順序：手を洗ってから食べる。注意：主觀原因，語氣較直接，後半可接命令、請求。",
      "example":"9時から授業が始まります。（9點開始上課。）"
    },
    {
      "id":"g_pdf_08",
      "level":"N5",
      "pattern":"助詞「ので」",
      "meaning":"客觀因果關係、委婉說法",
      "explanation":"描述事實上的原因，語氣較委婉、禮貌。接續：動詞/形容詞普通體 + ので；名詞/な形容詞 + なので。通常不接命令、勸誘。",
      "example":"雨が降っているので、傘を持って行きます。（因為在下雨，所以帶傘去。）"
    },
    {
      "id":"g_pdf_09",
      "level":"N5",
      "pattern":"助詞「を」",
      "meaning":"動作直接受詞、移動經過場所、離開起點、情感對象",
      "explanation":"1.受詞：本を読む。2.移動經過：公園を散歩する。3.離開起點：家を出る。4.情感對象：先生を尊敬する。注意：自動詞（狀態改變）不可用「を」。",
      "example":"本を読みます。（讀書。）"
    },
    {
      "id":"g_pdf_10",
      "level":"N5",
      "pattern":"助詞「と」",
      "meaning":"列舉並列、共同動作對象、引用內容、必然結果、比較對象",
      "explanation":"1.並列：AとB。2.共同動作：友達と映画を見る。3.引用：言う、思う、考える。4.必然條件：春になると花が咲く（後半不能接意志、命令）。5.比較：AとBとどちらが。",
      "example":"友達と映画を見ます。（和朋友看電影。）"
    },
    {
      "id":"g_pdf_11",
      "level":"N5",
      "pattern":"助詞「へ」",
      "meaning":"移動的方向、對象",
      "explanation":"1.方向：強調移動的過程與方向感（日本へ行く）。2.對象：書信、公文用（山田さんへの手紙）。注意：與「に」多數可互換，但「に」強調到達點，不確定時用「に」是安全牌。",
      "example":"日本へ行きます。（去日本。）"
    },
    {
      "id":"g_pdf_12",
      "level":"N5",
      "pattern":"助詞「の」",
      "meaning":"領屬修飾、替代名詞、名詞化、代替主格、同位格、句尾語氣",
      "explanation":"1.的：私の本。2.替代：大きいのを買う。3.名詞化：走るのが速い（感官動詞前用の）。4.代替が：髪の長い人。5.同位格：友達の田中さん。6.句尾：質問或輕微主張。",
      "example":"これは私の本です。（這是我的書。）"
    },
    {
      "id":"g_pdf_13",
      "level":"N5",
      "pattern":"助詞「や」",
      "meaning":"不完全列舉、強調變化瞬間、感嘆",
      "explanation":"1.列舉：AやBなど（暗示還有其他）。2.瞬間：動詞連用形 + や（剛...就...）。3.感嘆：花や散りぬ。注意：不能與「など」連用（重複）。",
      "example":"机の上に本やペンがあります。（桌上有書和筆等。）"

  "examPoints": [
    {
      "id":"e_pdf_01",
      "level":"N5",
      "title":"助詞「は」與「が」的終極辨析",
      "content":"「は」提示主題（已知資訊，焦點在後面的說明），「が」標記主語（新資訊，焦點在「が」的前面，強調排他、驚訝、發現）。否定句中經常用「は」取代「が」或「を」來表示排他性否定。",
      "tips":"自我介紹用「私は田中です」，回答「誰？」用「私が田中です」。"
    },
    {
      "id":"e_pdf_02",
      "level":"N5",
      "title":"助詞「に」與「で」的場所用法",
      "content":"「に」強調存在的點或到達的點（ある、いる、住む、座る）；「で」強調動作發生的場所（食べる、勉強する、遊ぶ）。",
      "tips":"部屋にいます（在房間，狀態）；部屋で勉強します（在房間學習，動作）。"
    },
    {
      "id":"e_pdf_03",
      "level":"N4",
      "title":"四大條件句（と、ば、たら、なら）核心區別",
      "content":"と表必然（自然/機器/習慣），後半不接意志/命令；ば表假設（必要條件）；たら最萬能（完成/假設），後接意志/命令；なら承接話題，常用於建議。",
      "tips":"春になると花が咲く（自然）；雨が降ったら行きません（假設）。"
    },
    {
      "id":"e_pdf_04",
      "level":"N4",
      "title":"原因理由「から」與「ので」的語感差異",
      "content":"から主觀直接，後半可接命令、推測、意志；ので客觀委婉，禮貌，前接名詞/な形容詞需加な，通常不接命令句。",
      "tips":"時間がないから早くして（主觀）；雨なので行きません（客觀）。"
    },
    {
      "id":"e_pdf_05",
      "level":"N4",
      "title":"逆接「ても」與「のに」的區別",
      "content":"ても表即便...也（假設或事實，客觀）；のに表明明...卻（帶有意外、不滿、遺憾，主觀情緒重）。",
      "tips":"雨が降っても行きます（客觀讓步）；勉強したのに合格できなかった（不滿）。"
    },
    {
      "id":"e_pdf_06",
      "level":"N3",
      "title":"目的「ために」與「ように」",
      "content":"ために接意志動詞，前後主語需一致；ように接非意志動詞、可能動詞或否定形。",
      "tips":"試験のために勉強する（意志）；忘れないようにメモする（非意志）。"
    },
    {
      "id":"e_pdf_07",
      "level":"N3",
      "title":"名詞化「の」與「こと」的絕對法則",
      "content":"感官動詞（見る、聞く、止める等）後必須用の；思考、語言、能力（言う、思う、できる）及固定句型（ことがある/ことにする）用こと。",
      "tips":"彼が走るのを見た；日本語を話すことができる。"
    },
    {
      "id":"e_pdf_08",
      "level":"N4",
      "title":"授受動詞「あげる・くれる・もらう」方向性",
      "content":"あげる（我→人，人→人，向外）；くれる（人→我，向內）；もらう（我←人，以我為主語）。",
      "tips":"友達に本をあげた；友達が本をくれた；友達に本をもらった。"
    },
    {
      "id":"e_pdf_09",
      "level":"N4",
      "title":"被動形的主語陷阱",
      "content":"主語不能是身體的一部分或所有物。需以「人」作為主語。",
      "tips":"私は犬に手を噛まれました。（我的手被狗咬了。）"
    },
    {
      "id":"e_pdf_10",
      "level":"N3",
      "title":"敬語的特殊限制與單音節動詞",
      "content":"います、寝ます等單音節動詞，不能使用「お～になる」或「お～ください」。",
      "tips":"不能說「お寝になる」，需用其他敬語形式。"
    },
    {
      "id":"e_pdf_11",
      "level":"N4",
      "title":"「～そうです」的樣態與傳聞",
      "content":"樣態接續為動詞ます形/形容詞詞幹，不可接名詞；傳聞接續為普通體，名詞/な形容詞需加だ。傳聞的否定是「～ないそうです」，不能直接否定そうです。",
      "tips":"おいしそう（樣態）；雨が降るそうだ（傳聞）；降らないそうだ（傳聞否定）。"
    },
    {
      "id":"e_pdf_12",
      "level":"N4",
      "title":"特殊形容詞「いい」與「ない」的變化",
      "content":"いい → よさそう / よすぎる / よければ；ない → なさそう / なさすぎる。",
      "tips":"考試高頻陷阱，切勿寫成「いそう」或「なそう」。"
    },
    {
      "id":"e_pdf_13",
      "level":"N4",
      "title":"能力動詞的助詞變化",
      "content":"動詞變成可能形後，原本的賓語助詞「を」通常要改為「が」。",
      "tips":"フランス語が話せます。（會說法語。）"
    },
    {
      "id":"e_pdf_14",
      "level":"N4",
      "title":"「だけ」與「しか」的限定語感",
      "content":"だけ客觀限定，肯定/否定皆可；しか必須搭配否定，帶有遺憾、不滿、少/無奈的語感。",
      "tips":"100円だけあります（有100元）；100円しかありません（只剩100元，很少）。"
    },
    {
      "id":"e_pdf_15",
      "level":"N5",
      "title":"動詞形態變化總複習（て形、た形）",
      "content":"五段動詞音變規則：う/つ/る→って、む/ぶ/ぬ→んで、く→いて、ぐ→いで、す→して。行く特殊為行って。",
      "tips":"考試必考基礎，必須滾瓜爛熟。"
    },
    {
      "id":"e_pdf_16",
      "level":"N4",
      "title":"自動詞與他動詞的助詞使用",
      "content":"自動詞描述狀態變化，主語用「が」；他動詞描述動作施加，賓語用「を」。",
      "tips":"ドアが開く（自動，狀態）；ドアを開ける（他動，動作）。"
    },
    {
      "id":"e_pdf_17",
      "level":"N4",
      "title":"比較級與最高級句型",
      "content":"AはBより...；BはAほど...ない；[範圍]で...が一番...。",
      "tips":"常與副詞ずっと（差距大）、同じくらい（差不多）搭配。"
    },
    {
      "id":"e_pdf_18",
      "level":"N3",
      "title":"指示詞「こ/そ/あ」的語境區分",
      "content":"そ：轉述聽者不知道的事物；あ：雙方都知道的話題。",
      "tips":"考試閱讀理解常考。"
    },
    {
      "id":"e_pdf_19",
      "level":"N4",
      "title":"推測表現（かもしれません、でしょう、らしい、ようです）強弱",
      "content":"可能性高低：でしょう > ようです/らしい > かもしれません。らしい側重傳聞/典型特徵，ようだ側重主觀判斷。",
      "tips":"考試選擇題常考語境辨析。"
    },
    {
      "id":"e_pdf_20",
      "level":"N3",
      "title":"「～てある」與「～ておく」的對比",
      "content":"てある：人為結果狀態的存留（強調狀態），助詞用が；ておく：預先做好某事（強調動作），助詞用を。",
      "tips":"窓が開けてある（狀態）；窓を開けておく（動作）。"
    }
  ],

    /* ===== 讀取嵌入的兩個 JSON ===== */
    function readEmbeddedJSON(id) {
      const el = document.getElementById(id);
      if (!el) return null;
      const raw = el.textContent.trim();
      if (!raw) return null;
      try { return JSON.parse(raw); }
      catch (e) {
        console.error('JSON ' + id + ' 解析失敗', e);
        // 新增：顯示錯誤提示，避免默默失敗
        const b = document.getElementById('errorBanner');
        const m = document.getElementById('errorMsg');
        if (b && m) {
          b.style.display = 'block';
          m.textContent = `內嵌 JSON「${id}」解析失敗：${e.message}（請檢查是否有多餘的 }、]、重複的 key）`;
        }
        return null;
      }
    }

    /* ===== 合併函式：把三份資料合併成一份 ===== */
    function buildMergedData() {
      const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
      const grammarJson = readEmbeddedJSON('json-grammar');

      // 1. 合併 json-grammar
      if (grammarJson && typeof grammarJson === 'object') {
        ['vocabulary', 'grammar', 'examPoints', 'quiz'].forEach(cat => {
          if (Array.isArray(grammarJson[cat])) {
            grammarJson[cat].forEach(item => {
              if (item && typeof item === 'object') {
                item.id = item.id || (cat[0] + '_ext_' + Math.random());
                base[cat].push(item);
              }
            });
          }
        });
      }

      // 2. ★ 新增：grammar 去重（同 level + pattern，保留 explanation 最長者）
      const grammarMap = new Map();
      base.grammar.forEach(item => {
        const key = (item.level || '') + '||' + (item.pattern || '').trim();
        const existing = grammarMap.get(key);
        if (!existing) {
          grammarMap.set(key, item);
        } else {
          const lenNew = (item.explanation || '').length + (item.meaning || '').length;
          const lenOld = (existing.explanation || '').length + (existing.meaning || '').length;
          if (lenNew > lenOld) grammarMap.set(key, item);  // 保留資訊較多者
        }
      });
      const beforeCount = base.grammar.length;
      base.grammar = Array.from(grammarMap.values());
      console.log(`[去重] grammar: ${beforeCount} → ${base.grammar.length}`);

      // 3. 合併 json-words（原本的完整邏輯，請確保在 return 之前）
      const wordsJson = readEmbeddedJSON('json-words');
      if (Array.isArray(wordsJson)) {
        const seen = new Set();
        base.vocabulary.forEach(w => { if (w.word) seen.add(w.word); });

        wordsJson.forEach((w, i) => {
          if (!w || !w.word || seen.has(w.word)) return;
          seen.add(w.word);
          base.vocabulary.push({
            id: w.id || ('wv_' + i),
            level: w.level || 'N1',
            word: w.word,
            reading: w.reading || '',
            meaning: w.meaning || '',
            category: w.category || '',
            example: w.example || '',
            year: w.year || ''
          });
        });
      }

      return base; // 一定要在最後
    }

    /* ===== 儲存安全版 ===== */
    const STORAGE_KEY = "jlpt_study_v4";
    const BOOKMARK_KEY = "jlpt_bookmarks_v4";

    function cloneDefault() {
      try { return buildMergedData(); }
      catch (e) { console.error('buildMergedData 失敗', e); return { vocabulary: [], grammar: [], examPoints: [], quiz: [] }; }
    }
    function isValidData(d) {
      return d && typeof d === "object"
        && Array.isArray(d.vocabulary) && Array.isArray(d.grammar)
        && Array.isArray(d.examPoints) && Array.isArray(d.quiz);
    }
    function safeGet(key) {
      try { if (typeof localStorage !== "undefined" && localStorage) return localStorage.getItem(key); }
      catch (e) { console.warn("localStorage 讀取失敗", e); }
      return null;
    }
    function safeSet(key, val) {
      try { if (typeof localStorage !== "undefined" && localStorage) { localStorage.setItem(key, val); return true; } }
      catch (e) { console.warn("localStorage 寫入失敗", e); }
      return false;
    }
    function safeRemove(key) {
      try { if (typeof localStorage !== "undefined" && localStorage) localStorage.removeItem(key); }
      catch (e) { }
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function initDarkMode() {
      const saved = safeGet("jlpt_theme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = saved ? saved === "dark" : prefersDark;
      if (isDark) document.documentElement.classList.add("dark");
      updateDarkIcon();
    }
    function toggleDarkMode() {
      document.documentElement.classList.toggle("dark");
      const isDark = document.documentElement.classList.contains("dark");
      safeSet("jlpt_theme", isDark ? "dark" : "light");
      updateDarkIcon();
      const meta = document.getElementById("themeColorMeta");
      if (meta) meta.setAttribute("content", isDark ? "#0f172a" : "#f8fafc");
    }
    function updateDarkIcon() {
      const btn = document.getElementById("darkBtn");
      if (!btn) return;
      btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
    }

    function loadAll() {
      const raw = safeGet(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (isValidData(parsed)) DATA = parsed;
          else DATA = cloneDefault();
        } catch (e) { DATA = cloneDefault(); }
      } else {
        DATA = cloneDefault();
      }
      const rawB = safeGet(BOOKMARK_KEY);
      if (rawB) {
        try { BOOKMARKS = new Set(JSON.parse(rawB)); } catch (e) { BOOKMARKS = new Set(); }
      }
    }
    function saveData() { safeSet(STORAGE_KEY, JSON.stringify(DATA)); }
    function saveBookmarks() { safeSet(BOOKMARK_KEY, JSON.stringify(Array.from(BOOKMARKS))); }

    function renderCatTabs() {
      const el = document.getElementById("catTabs");
      if (!el) return;
      el.innerHTML = CATS.map(c => `<button class="cat-tab ${STATE.cat === c.id ? 'active' : ''}" onclick="setCat('${c.id}')">${c.label}</button>`).join("");
    }

    function getFiltered() {
      let list = (DATA[STATE.cat] || []).filter(item => {
        // 1. 級別篩選
        if (STATE.level !== "ALL" && item.level !== STATE.level) return false;

        // 2. 收藏篩選
        if (STATE.bookmarkOnly && !BOOKMARKS.has(item.id)) return false;

        // 3. 關鍵字搜尋
        if (STATE.keyword) {
          const kw = STATE.keyword.toLowerCase();
          try {
            if (!JSON.stringify(item).toLowerCase().includes(kw)) return false;
          } catch (e) { return false; }
        }

        // 4. 五十音篩選
        if (STATE.kana !== "ALL") {
          const targetChars = KANA_MAP[STATE.kana] || "";
          // 優先取 reading（假名），若無則取 word，文法取 pattern
          let reading = item.reading || item.word || item.pattern || "";
          // 去掉開頭的「〜」、空白等裝飾符號
          reading = reading.replace(/^[〜\s\u3000]+/, "");
          const firstChar = reading.charAt(0);
          if (!targetChars.includes(firstChar)) return false;
        }

        return true;
      });

      // 5. 排序：若為單字或文法，按假名五十音順排序
      if (STATE.cat === "vocabulary" || STATE.cat === "grammar") {
        list.sort((a, b) => {
          let ra = (a.reading || a.word || a.pattern || "").replace(/^[〜\s\u3000]+/, "");
          let rb = (b.reading || b.word || b.pattern || "").replace(/^[〜\s\u3000]+/, "");
          // 使用 localeCompare 並指定日文 locale
          return ra.localeCompare(rb, "ja");
        });
      }

      return list;
    }

    /* ===== 完全重複判斷：把 item 轉成可比較的字串（去掉 id）===== */
    function normalizeItem(item) {
      if (!item || typeof item !== "object") return "";
      const keys = Object.keys(item).filter(k => k !== "id").sort();
      const normalized = {};
      keys.forEach(k => { normalized[k] = item[k]; });
      try { return JSON.stringify(normalized); }
      catch (e) { return ""; }
    }

    /* ===== 建立某分類現有的 normalized Set（加速比對）===== */
    function buildNormalizedSet(cat) {
      const list = DATA[cat] || [];
      const set = new Set();
      list.forEach(item => {
        const n = normalizeItem(item);
        if (n) set.add(n);
      });
      return set;
    }

    /* ===== upsert：完全重複就跳過，否則追加 ===== */
    function upsertItems(cat, items, idPrefix) {
      const existingSet = buildNormalizedSet(cat);
      let added = 0, skipped = 0;
      (items || []).forEach(item => {
        if (!item || typeof item !== "object") { skipped++; return; }
        const n = normalizeItem(item);
        if (!n) { skipped++; return; }
        if (existingSet.has(n)) { skipped++; return; }
        existingSet.add(n);
        DATA[cat].push({
          ...item,
          id: item.id || (idPrefix + Date.now() + Math.floor(Math.random() * 10000))
        });
        added++;
      });
      return { added, skipped };
    }

    function mergeImport(p) {
      const counts = { vocabulary: 0, grammar: 0, examPoints: 0, quiz: 0, skipped: 0 };

      // 情況 1：純陣列 → 當作單字匯入
      if (Array.isArray(p)) {
        const items = [];
        p.forEach(item => {
          if (item && item.word && (item.meaning || item.definition)) {
            items.push({
              level: item.level || "N1",
              word: item.word,
              reading: item.reading || item.kana || "",
              meaning: item.meaning || item.definition || "",
              category: item.category || item.type || item.pos || item.partOfSpeech || "",
              example: item.example || item.sentence || "",
              year: item.year || ""
            });
          }
        });
        const r = upsertItems("vocabulary", items, "v_");
        counts.vocabulary = r.added;
        counts.skipped = r.skipped;
        return counts;
      }
      if (p && typeof p === "object") {
        // 情況 2：物件 → 逐類 upsert
        if (p && typeof p === "object") {
          ["vocabulary", "grammar", "examPoints", "quiz"].forEach(cat => {
            if (Array.isArray(p[cat])) {
              const r = upsertItems(cat, p[cat], cat[0] + "_");
              counts[cat] = r.added;
              counts.skipped += r.skipped;
            }
          });
        }
        return counts;
      }
      if (p && typeof p === "object") {
        ["vocabulary", "grammar", "examPoints", "quiz"].forEach(cat => {
          if (Array.isArray(p[cat])) {
            p[cat].forEach((item, i) => {
              if (!item || typeof item !== "object") return;
              DATA[cat].push({ ...item, id: item.id || (cat[0] + stamp + i + Math.floor(Math.random() * 1000)) });
              counts[cat]++;
            });
          }
        });
      }
      return counts;
    }
    function importCSVFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const text = ev.target.result.replace(/^\uFEFF/, "");
          const rows = parseCSV(text);
          const buckets = { vocabulary: [], grammar: [], examPoints: [], quiz: [] };

          rows.slice(1).forEach(r => {
            const cat = (r[0] || "").trim();
            if (!buckets[cat]) return;
            const level = (r[1] || "").trim() || "N1";
            const main = (r[2] || "").trim();
            if (!main) return;

            if (cat === "vocabulary") {
              buckets.vocabulary.push({
                level, word: main,
                reading: (r[3] || "").trim(),
                meaning: (r[4] || "").trim(),
                category: (r[5] || "").trim(),
                example: (r[6] || "").trim(),
                year: ""
              });
            } else if (cat === "grammar") {
              buckets.grammar.push({
                level, pattern: main,
                meaning: (r[4] || "").trim(),
                explanation: (r[5] || "").trim(),
                example: (r[6] || "").trim()
              });
            } else if (cat === "examPoints") {
              buckets.examPoints.push({
                level, title: main,
                content: (r[4] || "").trim(),
                tips: (r[5] || "").trim()
              });
            } else if (cat === "quiz") {
              const opts = (r[7] || "").split("|").map(s => s.trim()).filter(Boolean);
              if (opts.length >= 2) {
                buckets.quiz.push({
                  level, question: main, options: opts,
                  answer: parseInt(r[8] || "0") || 0,
                  explanation: (r[5] || "").trim()
                });
              }
            }
          });

          const counts = { vocabulary: 0, grammar: 0, examPoints: 0, quiz: 0, skipped: 0 };
          Object.keys(buckets).forEach(cat => {
            const r = upsertItems(cat, buckets[cat], cat[0] + "_");
            counts[cat] = r.added;
            counts.skipped += r.skipped;
          });

          saveData(); renderAll();
          toast(`✅ 新增：單字+${counts.vocabulary}、文法+${counts.grammar}、重點+${counts.examPoints}、試題+${counts.quiz}｜跳過重複 ${counts.skipped} 筆`);
          closeDrawer();
        } catch (err) { toast("CSV 解析失敗：" + err.message); }
        e.target.value = "";
      };
      reader.readAsText(file, "UTF-8");
    }
    function parseCSV(text) {
      const rows = []; let cur = [], field = "", inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
          else field += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ",") { cur.push(field); field = ""; }
          else if (c === "\n") { cur.push(field); rows.push(cur); cur = []; field = ""; }
          else if (c === "\r") { }
          else field += c;
        }
      }
      if (field || cur.length) { cur.push(field); rows.push(cur); }
      return rows.filter(r => r.some(c => String(c).trim() !== ""));
    }

    function openPasteModal() { document.getElementById("pasteModal").classList.add("show"); }
    function closePasteModal() { document.getElementById("pasteModal").classList.remove("show"); }
    function processPastedJSON() {
      const raw = document.getElementById("pasteInput").value.trim();
      if (!raw) { toast("請貼上 JSON"); return; }
      let p;
      try { p = JSON.parse(raw); } catch (e) { toast("❌ JSON 格式錯誤"); return; }
      try {
        const counts = mergeImport(p);
        const total = counts.vocabulary + counts.grammar + counts.examPoints + counts.quiz;
        if (total === 0 && counts.skipped === 0) { toast("⚠️ 格式不符或無資料"); return; }
        saveData(); renderAll();
        toast(`✅ 新增：單字+${counts.vocabulary}、文法+${counts.grammar}、重點+${counts.examPoints}、試題+${counts.quiz}｜跳過重複 ${counts.skipped} 筆`);
        document.getElementById("pasteInput").value = "";
        closePasteModal();
      } catch (e) { toast("匯入失敗：" + e.message); }
    }

    function startFlashcardQuiz() {
      const list = getFiltered();
      if (list.length === 0) { toast("目前沒有可測驗的資料"); return; }
      quizState = { mode: "flash", list, index: 0, flipped: false };
      document.getElementById("quizTitle").textContent = "🎴 翻牌測驗";
      document.getElementById("flashcardMode").style.display = "block";
      document.getElementById("choiceMode").style.display = "none";
      document.getElementById("quizModal").classList.add("show");
      renderFlashcard();
    }
    function renderFlashcard() {
      const c = quizState.list[quizState.index]; if (!c) return;
      document.getElementById("quizProgress").textContent = `${quizState.index + 1} / ${quizState.list.length}`;
      const lvEl = document.getElementById("fcLevel");
      lvEl.className = "badge badge-" + (c.level || "N5");
      lvEl.textContent = c.level || "";
      document.getElementById("fcCategory").textContent = c.category || c.pattern || "單字";
      document.getElementById("fcWord").textContent = c.word || c.pattern || c.title || c.question || "";
      document.getElementById("fcReading").textContent = c.reading ? `[ ${c.reading} ]` : "";
      document.getElementById("fcMeaning").textContent = c.meaning || c.content || c.explanation || (c.options ? c.options[c.answer] : "");
      const ex = document.getElementById("fcExample");
      ex.textContent = c.example || c.explanation || "";
      ex.style.display = (c.example || c.explanation) ? "block" : "none";
      document.getElementById("fcYear").textContent = c.year || "";
      document.getElementById("fcInner").classList.remove("flipped");
      quizState.flipped = false;
    }
    function flipCard() {
      quizState.flipped = !quizState.flipped;
      document.getElementById("fcInner").classList.toggle("flipped", quizState.flipped);
    }
    function nextCard() {
      if (quizState.index < quizState.list.length - 1) { quizState.index++; renderFlashcard(); }
      else toast("🎉 已完成所有卡片");
    }
    function prevCard() {
      if (quizState.index > 0) { quizState.index--; renderFlashcard(); }
    }
    function startChoiceQuiz() {
      const vocab = (DATA.vocabulary || []).filter(item => {
        if (STATE.level !== "ALL" && item.level !== STATE.level) return false;
        return item.meaning && item.word;
      });
      if (vocab.length < 4) { toast("至少需要 4 個單字才能測驗"); return; }
      const shuffled = [...vocab].sort(() => Math.random() - 0.5).slice(0, Math.min(10, vocab.length));
      quizState = { mode: "choice", list: shuffled, index: 0, pool: vocab };
      document.getElementById("quizTitle").textContent = "📝 四選一測驗";
      document.getElementById("flashcardMode").style.display = "none";
      document.getElementById("choiceMode").style.display = "block";
      document.getElementById("quizModal").classList.add("show");
      renderChoiceQuestion();
    }
    function renderChoiceQuestion() {
      const c = quizState.list[quizState.index]; if (!c) return;
      document.getElementById("quizProgress").textContent = `${quizState.index + 1} / ${quizState.list.length}`;
      const lvEl = document.getElementById("mcLevel");
      lvEl.className = "badge badge-" + (c.level || "N5");
      lvEl.textContent = c.level || "";
      document.getElementById("mcCategory").textContent = c.category || "單字";
      document.getElementById("mcWord").textContent = c.word || "";
      document.getElementById("mcReading").textContent = c.reading ? `[ ${c.reading} ]` : "";
      document.getElementById("mcFeedback").textContent = "";
      const others = quizState.pool.filter(x => x.id !== c.id).sort(() => Math.random() - 0.5).slice(0, 3);
      const opts = [...others, c].sort(() => Math.random() - 0.5);
      const box = document.getElementById("mcOptions");
      box.innerHTML = opts.map(o => `<button class="quiz-option" data-correct="${o.id === c.id}">${escapeHtml(o.meaning)}</button>`).join("");
      box.querySelectorAll(".quiz-option").forEach(btn => {
        btn.onclick = () => {
          const correct = btn.getAttribute("data-correct") === "true";
          box.querySelectorAll(".quiz-option").forEach(b => {
            b.disabled = true;
            if (b.getAttribute("data-correct") === "true") b.classList.add("correct");
          });
          if (!correct) btn.classList.add("wrong");
          const fb = document.getElementById("mcFeedback");
          fb.textContent = correct ? "✅ 正確！" : "❌ 答錯了";
          fb.style.color = correct ? "var(--matcha500)" : "#dc2626";
          setTimeout(() => {
            if (quizState.index < quizState.list.length - 1) { quizState.index++; renderChoiceQuestion(); }
            else { toast("🎉 測驗完成！"); closeQuizModal(); }
          }, 1000);
        };
      });
    }
    function closeQuizModal() { document.getElementById("quizModal").classList.remove("show"); }

    function renderAll() {
      try {
        renderCatTabs();
        renderLevelFilters();
        renderKanaFilters();   // 新增這行
        updateBookmarkCount();
        const btn = document.getElementById("bookmarkBtn");
        if (btn) btn.classList.toggle("active", STATE.bookmarkOnly);
        renderContent();
      } catch (e) {
        console.error(e);
      }
    }

    function init() {
      loadAll();
      initDarkMode();
      document.querySelectorAll(".modal").forEach(m => {
        m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); });
      });
      renderAll();

      // 顯示合併結果
      const counts = {
        vocabulary: DATA.vocabulary ? DATA.vocabulary.length : 0,
        grammar: DATA.grammar ? DATA.grammar.length : 0,
        examPoints: DATA.examPoints ? DATA.examPoints.length : 0,
        quiz: DATA.quiz ? DATA.quiz.length : 0
      };
      setTimeout(() => {
        toast(`✅ 載入完成：單字 ${counts.vocabulary}、文法 ${counts.grammar}、重點 ${counts.examPoints}、試題 ${counts.quiz}`);
      }, 300);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  </script>
</body>
